name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose: action-setup@v4 refuses when a version is
      # given BOTH here and as `packageManager` in package.json, which is the
      # single source of truth. Pinning it twice failed every run outright.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: build shippable artifacts
        run: node scripts/build-dist.mjs
