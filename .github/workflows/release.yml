name: release

# Tag a version (e.g. `git tag v0.1.0 && git push --tags`) to build the plugin
# and attach a prebuilt tarball to the GitHub release. The awesome-dsh-plugin
# entry's `tarball:` field points at releases/latest/download/dshn-agent.tgz.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: build the bundled plugin
        run: node scripts/build-dist.mjs
      - name: pack the plugin tarball
        run: |
          npm pack ./dist/dshn-agent --pack-destination .
          mv dshn-agent-*.tgz dshn-agent.tgz
      - name: publish release with the tarball
        uses: softprops/action-gh-release@v2
        with:
          files: dshn-agent.tgz
          generate_release_notes: true
